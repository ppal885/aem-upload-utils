name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api and quick UI
            suites: unit backup adaptive low skip-top folders signup package skip-unchanged copy keep-names readiness ditaot review progress two-users team signup-api
          - group: large selections
            suites: high high-7-8 medium background
          - group: restart and queue
            suites: resume queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/requirements.txt
      - run: sudo apt-get install -y --no-install-recommends libarchive-tools
      - run: npm ci
      - run: pip install -r test/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run suites
        run: node test/run.js ${{ matrix.suites }}
        env:
          TEST_WORK_DIR: ${{ runner.temp }}/aem-upload-test
      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/aem-upload-test/logs
          retention-days: 7
